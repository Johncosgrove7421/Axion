name: Deploy to Pi

on:
  push:
    branches: [ Master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Connect to Twingate
      - name: Connect to Twingate
        uses: twingate/github-action@v1
        with:
          service-key: ${{ secrets.TWINGATE_SERVICE_KEY }}

      # Setup SSH
      - name: Setup SSH
        shell: bash
        run: |
          set -euo pipefail

          # Start ssh-agent
          eval "$(ssh-agent -s)"

          # Add private key
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' | ssh-add -

          # Create .ssh directory
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          # Remove any stale host entry
          ssh-keygen -R "${{ secrets.SSH_HOST }}" || true

          # Add host key (port 22 — change if needed)
          ssh-keyscan -T 5 -p 22 -H "${{ secrets.SSH_HOST }}" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Debug SSH key being used
        shell: bash
        run: |
          set -euo pipefail
          eval "$(ssh-agent -s)"
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' | ssh-add -
      
          echo "Keys loaded into agent:"
          ssh-add -l || true
      
          # Print fingerprint of the private key WITHOUT exposing it
          tmpkey="$(mktemp)"
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > "$tmpkey"
          chmod 600 "$tmpkey"
          echo "Fingerprint of CI private key:"
          ssh-keygen -lf "$tmpkey"
          rm -f "$tmpkey"
      # SSH + Pull
      - name: Deploy on Pi
        shell: bash
        run: |
          set -euo pipefail

          ssh -p 22 \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "set -e;
             cd '${{ secrets.WORK_DIR }}';
             git fetch origin;
             git checkout '${{ secrets.MAIN_BRANCH }}';
             git pull --ff-only;"
