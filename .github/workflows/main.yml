on:
  push:
    branches:
      - Master
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Twingate
        uses: twingate/github-action@v1
        with:
          service-key: ${{ secrets.TWINGATE_SERVICE_KEY }}

      - name: Debug SSH reachability
        shell: bash
        run: |
          set -euo pipefail
          echo "SSH_HOST=${{ secrets.SSH_HOST }}"
          echo "SSH_PORT=${{ secrets.SSH_PORT || '22' }}"
      
          # DNS
          getent hosts "${{ secrets.SSH_HOST }}" || true
      
          # Port check (prefers nc, falls back to bash)
          if command -v nc >/dev/null 2>&1; then
            nc -vz -w 5 "${{ secrets.SSH_HOST }}" "${{ secrets.SSH_PORT || '22' }}"
          else
            timeout 5 bash -lc "</dev/tcp/${{ secrets.SSH_HOST }}/${{ secrets.SSH_PORT || '22' }}" && echo "port open"
          fi

      - name: SSH to Pi and run command
        shell: bash
        run: |
          set -euo pipefail
          eval "$(ssh-agent -s)"
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' | ssh-add -

          ssh -o IdentitiesOnly=yes \
              "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
              "hostname; uptime"
